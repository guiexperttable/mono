# Build check for the whole mono repo + tests of the core and of the framework wrappers (no publishing, no secrets).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # types, JSDoc examples, unit tests (Node), browser tests (Chromium) of @guiexpert/table – runs parallel to the build
  test-core:
    uses: ./.github/workflows/test-core.yml

  # smoke tests of the framework wrappers (React, Preact, Vue 3, Svelte 4 + 5, Solid, Web Component) in headless
  # Chromium – they import the core from packages/table/src, so no build is needed; runs parallel to the build
  test-wrappers:
    uses: ./.github/workflows/test-wrappers.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6   # version from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm build:core

      - name: Build libraries
        run: pnpm build:libs

      - name: Build Angular 14 … 22
        run: pnpm build:angular

      - name: Versions
        run: pnpm version:check || true
