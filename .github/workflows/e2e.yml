# E2E smoke tests of the BUILT apps with Playwright (prompt 026, apps/e2e): every showcase and training chapter of the
# website, every apps/table-demo page, every framework demo (incl. Angular 17 + 22 and `ng serve` of the Angular demo)
# in Chromium and Firefox – page loads, no console errors/warnings, no failed or foreign requests, the table shows rows.
#
# Not blocking yet (continue-on-error): first collect experience, the date for "blocking" is in TODO.md.
# Not part of npm-publish.yml.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E smoke (Chromium, Firefox)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      CYPRESS_INSTALL_BINARY: 0   # @cypress/vue (vue3-table devDependency) – the Cypress binary is not needed
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6   # version from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-e2e-${{ hashFiles('apps/e2e/package.json') }}

      - name: Install Chromium and Firefox for Playwright
        run: pnpm --filter e2e exec playwright install --with-deps chromium firefox

      - name: Build everything the tests open (core, demo models, Angular 22, website, demo apps)
        run: pnpm test:e2e:build

      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          if-no-files-found: ignore
