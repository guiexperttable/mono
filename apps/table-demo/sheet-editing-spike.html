<!DOCTYPE html>
<!--
  Spike (prompt 013 stage 1, design § 2.10): typing, dead keys, IME and the clipboard on a focused table – per browser.
  Start: pnpm serve:table-demo → http://localhost:4200/sheet-editing-spike.html
  Fill the checklist in Chrome, Firefox and Safari (macOS: Japanese input; Windows: MS-IME / Chinese) and copy the
  result into prompts/013-tabellenkalkulation.design.md § 12 "Fortschritt".
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <title>GuiExpert Table – keyboard and clipboard spike</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <style>
    body { margin: 0; padding: 16px 24px; font-family: system-ui, sans-serif; }
    .table-div { height: 300px; width: 100%; max-width: 820px; }
    .cols { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 12px; }
    #events { font: 12px/1.45 ui-monospace, monospace; height: 280px; width: 460px; overflow: auto; border: 1px solid #ccc; padding: 6px; white-space: pre; }
    table.check td, table.check th { border: 1px solid #ccc; padding: 2px 6px; font-size: 13px; }
    #result { font: 12px ui-monospace, monospace; width: 100%; max-width: 820px; height: 90px; }
  </style>
</head>
<body>
<h1 style="font-size:20px">Keyboard and clipboard spike</h1>
<p>Click a cell, then try each case. The log shows key, composition, input and clipboard events (target and focus).</p>
<div class="table-div"></div>
<div class="cols">
  <div id="events" aria-label="event log"></div>
  <table class="check">
    <thead><tr><th>Case</th><th>Expected</th><th>OK?</th></tr></thead>
    <tbody id="checks"></tbody>
  </table>
</div>
<p><b id="ua"></b></p>
<textarea id="result" readonly aria-label="result"></textarea>
<script src="/src/sheet-editing/sheet-editing-spike.ts" type="module"></script>
</body>
</html>
