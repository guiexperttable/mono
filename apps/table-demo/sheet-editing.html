<!DOCTYPE html>
<!--
  Excel-style editing (since 1.1.99, prompt 013 stage 1).
  Start: pnpm serve:table-demo → http://localhost:4200/sheet-editing.html
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <title>GuiExpert Table – Excel-style editing</title>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <link href="/favicon.ico" rel="icon" type="image/x-icon"/>
  <style>
    body { margin: 0; padding: 16px 24px; font-family: system-ui, sans-serif; background: var(--ge-table-bg, #fff); color: var(--ge-table-header-center-text, #000); }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { margin: 4px 0; max-width: 860px; }
    .bar { display: flex; gap: 16px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
    .table-div { height: 460px; width: 100%; max-width: 940px; }
    #cell { font: 600 14px ui-monospace, monospace; min-width: 14em; }
    #log { font: 13px/1.5 ui-monospace, monospace; margin: 8px 0 0; min-height: 3em; white-space: pre-wrap; }
    kbd { font: 12px ui-monospace, monospace; border: 1px solid #999; border-radius: 3px; padding: 0 4px; }
  </style>
</head>
<body>
<h1>Orders – Excel-style editing</h1>
<p>Click a cell and <b>type</b>. <kbd>Enter</kbd> commits and moves down, <kbd>Tab</kbd> right, <kbd>Esc</kbd> discards,
  <kbd>F2</kbd> edits. <kbd>Shift</kbd>+arrows select, <kbd>Ctrl/⌘</kbd>+arrows jump, <kbd>Delete</kbd> clears,
  <kbd>Ctrl/⌘</kbd>+<kbd>Enter</kbd> fills the selection.</p>
<div class="bar">
  <span id="cell">–</span>
  <label><input id="moveDown" type="checkbox"> Enter moves down (Excel)</label>
  <label><input id="rtl" type="checkbox"> right-to-left</label>
  <label><input id="dark" type="checkbox"> dark</label>
</div>
<div class="table-div"></div>
<pre id="log" aria-live="off"></pre>
<script src="/src/sheet-editing/sheet-editing-demo.ts" type="module"></script>
</body>
</html>
