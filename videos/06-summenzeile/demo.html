<!doctype html>
<!--
  Recording page for episode 06 "Summenzeile in einer Zeile Code".
  Start (repo root):  pnpm build:core  &&  python3 -m http.server 8080
  Open:               http://localhost:8080/videos/06-summenzeile/demo.html
  Runs the code of snippet.ts (plain JS) with 1,000,000 generated orders.
-->
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>GuiExpert Table – Summenzeile</title>
  <link rel="stylesheet" href="../../packages/table/dist/css/main.css">
  <script type="importmap">{ "imports": { "@guiexpert/table": "../../packages/table/dist/index.js" } }</script>
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: var(--ge-table-bg, #fff); color: var(--ge-table-header-center-text, #000); font-size: 18px; }
    h1 { font-size: 24px; margin: 0; padding: 10px 16px 0; }
    .bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 8px 16px; }
    .bar button, .bar input { font: inherit; padding: 4px 12px; }
    .table-div { height: calc(100vh - 180px); margin: 0 16px; font-size: 17px; }
    .status { margin: 8px 16px; min-height: 1.4em; font-variant-numeric: tabular-nums; font-weight: 600; }
  </style>
</head>
<body>
<h1>Bestellungen</h1>
<div class="bar">
  <label>Kunde <input id="filter" type="search" placeholder="z. B. 42"></label>
  <button id="sort">Nach Summe sortieren</button>
  <label><input id="live" type="checkbox"> live</label>
  <label><input id="dark" type="checkbox"> dunkel</label>
</div>
<div class="table-div"></div>
<div class="status" id="status"></div>
<script type="module">
  import { EventAdapter, SelectionModel, SimpleDomService, TableCellUpdateEvent, TableFactory, TableOptions, TableScope } from "@guiexpert/table";

  let filterText = "";
  const statusBar = document.querySelector("#status");
  const bestellungen = Array.from({ length: 1_000_000 }, (_, i) =>
    ({ id: 100_000 + i, kunde: `Kunde ${i % 997}`, menge: 1 + (i * 31) % 20, summe: (i * 7919) % 10_000 }));

  // --- code of snippet.ts ---
  const tableModel = TableFactory.createTableModel({
    rows: bestellungen,
    properties: ["id", "kunde", "menge", "summe"],
    footerAggregates: { menge: "sum", summe: "sum" }
  });
  const selectionModel = new SelectionModel("range", "multi");
  const tableOptions = {
    ...new TableOptions(),
    getSelectionModel: () => selectionModel,
    externalFilterFunction: row => !filterText || row.kunde.endsWith(" " + filterText),
  };
  const listener = new EventAdapter();
  listener.onSelectionChanged = () => statusBar.textContent = `Σ ${api.getSelectionAggregates().sum.toLocaleString("de-DE")}`;
  const host = document.querySelector(".table-div");
  const api = new TableScope(host, tableModel, new SimpleDomService(), tableOptions, listener).firstInit().getApi();
  // ---

  document.querySelector("#sort").addEventListener("click", () => api.sort((a, b) => b.summe - a.summe));
  document.querySelector("#filter").addEventListener("input", e => {
    filterText = e.target.value.trim();
    api.externalFilterChanged();
  });
  let timer;
  document.querySelector("#live").addEventListener("change", e => {
    clearInterval(timer);
    if (!e.target.checked) return;
    timer = setInterval(() => {                     // a few visible rows get a new sum – the footer follows
      const row = api.getFirstVisibleRowIndex() + Math.floor(Math.random() * 8);
      api.updateCells([new TableCellUpdateEvent("body", row, 3, Math.floor(Math.random() * 10_000), {})]);
    }, 300);
  });
  document.querySelector("#dark").addEventListener("change", e =>
    document.documentElement.setAttribute("data-theme", e.target.checked ? "dark" : "light"));
</script>
</body>
</html>
